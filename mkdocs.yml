site_name: Knowledge Base Builder
site_url: https://kostadindev.github.io/knowledge-base-builder
site_description: Turn any source — web pages, PDFs, GitHub repos, YouTube, arXiv, RSS — into one structured Markdown knowledge base with an LLM. Built for RAG, /llms.txt, and chatbots.
site_author: Kostadin Devedzhiev
repo_url: https://github.com/kostadindev/knowledge-base-builder
repo_name: kostadindev/knowledge-base-builder
copyright: >
  Docs as Markdown for LLMs:
  <a href="https://kostadindev.github.io/knowledge-base-builder/llms.txt">llms.txt</a> ·
  <a href="https://kostadindev.github.io/knowledge-base-builder/llms-full.txt">llms-full.txt</a>

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - llmstxt:
      markdown_description: >-
        Knowledge Base Builder turns web pages, PDFs, GitHub repos, YouTube
        videos, arXiv papers, RSS feeds, notebooks, and slides into one
        structured Markdown knowledge base with an LLM. Built for RAG, /llms.txt,
        vector-DB ingestion, and chatbots.
      full_output: llms-full.txt
      sections:
        Getting Started:
          - index.md: Overview, highlights, and supported sources.
          - getting-started/installation.md: Core install and optional extras.
          - getting-started/quickstart.md: One-liner, raw mode, full control, and CLI.
          - getting-started/concepts.md: Sources, processors, providers, output formats.
        Guides:
          - guides/sources.md: Every supported source type and how routing works.
          - guides/output-formats.md: markdown, llms_txt, chunks, and raw.
          - guides/llms-txt.md: Generate a /llms.txt for your own site.
          - guides/recipes.md: Copy-paste recipes for common jobs.
        How It Works:
          - how-it-works/pipeline.md: Extraction, merge, and LLM structuring.
        API Reference:
          - api/build.md: The one-line build() convenience API.
          - api/kbbuilder.md: The KBBuilder class and build() parameters.
          - api/cli.md: Command-line interface reference.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kostadindev/knowledge-base-builder
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/knowledge-base-builder/

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Core Concepts: getting-started/concepts.md
  - Guides:
    - Sources: guides/sources.md
    - Output Formats: guides/output-formats.md
    - Generate /llms.txt: guides/llms-txt.md
    - Recipes: guides/recipes.md
  - How It Works:
    - The Pipeline: how-it-works/pipeline.md
  - API Reference:
    - build(): api/build.md
    - KBBuilder: api/kbbuilder.md
    - CLI: api/cli.md
